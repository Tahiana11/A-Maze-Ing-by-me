[project]
name = "mazegen"
version = "1.0.0"
description = "A standalone generic Maze Generator"
authors = [
    { name = "mamy-and", email = "mamy-and@student.42antananarivo.mg" },
    { name = "firahari", email = "firahari@student.42antananarivo.mg" },
]
readme = "README.md"
requires-python = ">=3.10"

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
